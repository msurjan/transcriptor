<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graiph — Transcripción de Sondajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="pagina-login">
  <div id="topnav" class="topnav" hidden></div>

  <div class="panel">
    <h1>Graiph — Transcripción de Sondajes</h1>

    <div id="vista-login">
      <form id="form-login">
        <label for="select-usuario">¿Quién eres?</label>
        <select id="select-usuario" disabled>
          <option value="" disabled selected>Cargando usuarios...</option>
        </select>

        <label for="input-password">Contraseña</label>
        <input type="password" id="input-password" autocomplete="current-password" required />

        <button type="submit" id="btn-entrar" class="btn" disabled>Entrar</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </div>

    <div id="vista-sesion" class="sesion" hidden>
      <p>Sesión iniciada como</p>
      <p class="nombre" id="sesion-nombre"></p>
      <span class="rol-badge" id="sesion-rol"></span>

      <div class="acciones-sesion">
        <a id="link-transcriptor" href="transcriptor.html" class="accion-card" hidden>
          <span class="accion-icono">📥</span>
          <span class="accion-texto">
            <span class="accion-titulo">Cargar sondaje</span>
            <span class="accion-desc">Subir PDF y Excel ya transcritos</span>
          </span>
        </a>
        <a id="link-qa" href="qa.html" class="accion-card" hidden>
          <span class="accion-icono">🔍</span>
          <span class="accion-texto">
            <span class="accion-titulo">QA</span>
            <span class="accion-desc">Revisar filas, fila por fila</span>
          </span>
        </a>
        <a id="link-exportar" href="exportar.html" class="accion-card" hidden>
          <span class="accion-icono">📤</span>
          <span class="accion-texto">
            <span class="accion-titulo">Exportar</span>
            <span class="accion-desc">Descargar sondajes en CSV o XLSX</span>
          </span>
        </a>
      </div>
    </div>
  </div>

  <script src="vendor/supabase-js.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/session.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
