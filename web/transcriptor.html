<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargar sondaje — Graiph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="topnav" class="topnav" hidden></div>

  <div class="pagina-angosta">
    <div class="panel">
      <h1>Cargar sondaje</h1>
      <p class="subtitulo">Sube el PDF original y el Excel ya transcrito.</p>

      <div id="aviso-rol" class="mensaje error" hidden>
        Tu rol no tiene acceso a esta pantalla. Solo los roles <strong>transcriptor</strong> y
        <strong>admin</strong> pueden cargar sondajes.
      </div>

      <form id="form-transcriptor">
        <label for="select-empresa">Empresa</label>
        <select id="select-empresa" disabled required>
          <option value="" disabled selected>Cargando empresas...</option>
        </select>

        <label for="input-codigo">Código del sondaje</label>
        <input type="text" id="input-codigo" placeholder="ej. DDH-T-10" required />

        <label for="input-pdf">PDF original</label>
        <input type="file" id="input-pdf" accept="application/pdf" required />

        <label for="input-excel">Excel ya transcrito (.xlsx)</label>
        <input type="file" id="input-excel" accept=".xlsx,.xls" required />

        <button type="submit" id="btn-cargar" class="btn" disabled>Cargar sondaje</button>
      </form>

      <p id="mensaje" class="mensaje"></p>
    </div>

    <div class="panel" id="card-lista-sondajes">
      <h1>Sondajes cargados</h1>
      <div id="lista-sondajes">
        <p class="mensaje">Cargando...</p>
      </div>
    </div>
  </div>

  <script src="vendor/supabase-js.min.js"></script>
  <script src="vendor/xlsx.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/session.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/transcriptor.js"></script>
</body>
</html>
