<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exportar sondajes — Graiph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/exportar.css" />
</head>
<body>
  <div id="topnav" class="topnav" hidden></div>

  <div class="pagina">
    <h1>Exportar sondajes</h1>
    <p class="subtitulo">Descarga los sondajes en CSV o XLSX y revisa quién exportó cada uno.</p>

    <div id="aviso-rol" class="mensaje error" hidden>
      Tu rol no tiene acceso a esta pantalla. Solo los roles <strong>lider</strong> y <strong>admin</strong>
      pueden exportar sondajes.
    </div>

    <div id="panel-exportar" hidden>
      <div class="barra-acciones-exportar">
        <label class="chk-todos">
          <input type="checkbox" id="chk-todos" /> Seleccionar todos
        </label>
        <span id="contador-seleccion" class="contador-seleccion">0 seleccionados</span>
        <div class="spacer-exportar"></div>
        <button type="button" id="btn-exportar-xlsx" class="btn btn-pequeno" disabled>⬇️ Exportar (.xlsx)</button>
        <button type="button" id="btn-exportar-csv" class="btn btn-pequeno btn-secundario" disabled>⬇️ Exportar (.csv)</button>
      </div>

      <div class="panel" id="tabla-wrap">
        <p id="mensaje-lista" class="mensaje">Cargando sondajes...</p>
      </div>
    </div>
  </div>

<script src="vendor/xlsx.min.js"></script>
<script src="vendor/supabase-js.min.js"></script>
<script src="config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/exportar.js"></script>
</body>
</html>
